name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile

      - run: bun test

      - run: pnpm build

      # magpie installs plugins from git without running build scripts, so the
      # committed ui/dist must match what the current sources build.
      - name: verify committed build output
        run: |
          if [ -n "$(git status --porcelain -- ui/dist)" ]; then
            echo "ui/dist is out of date; run pnpm build and commit the result" >&2
            git status --porcelain -- ui/dist >&2
            exit 1
          fi

  # 发版：推 v* tag 时由 GitHub Actions 的 OIDC 身份发布，不需要 NPM_TOKEN。
  # 前提是 npm 包的 Trusted Publisher 里登记了 guangzan/magpie-gateway-admin + ci.yml
  # （`npm trust github magpie-gateway-admin --file ci.yml --repo guangzan/magpie-gateway-admin --allow-publish`）。
  # 1.0.0 是 Trusted Publisher 存在之前手动发的，这里按版本跳过，重跑同一 tag 不会红。
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships an 11.x build,
      # but pin it forward so an older image cannot silently break publishing.
      - run: npm install -g npm@11

      - name: verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: check whether this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "magpie-gateway-admin@$version" version >/dev/null 2>&1; then
            echo "magpie-gateway-admin@$version is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
