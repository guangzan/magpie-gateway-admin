name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile

      - run: bun test

      - run: pnpm build

      # magpie installs plugins from git without running build scripts, so the
      # committed ui/dist must match what the current sources build.
      - name: verify committed build output
        run: |
          if [ -n "$(git status --porcelain -- ui/dist)" ]; then
            echo "ui/dist is out of date; run pnpm build and commit the result" >&2
            git status --porcelain -- ui/dist >&2
            exit 1
          fi

